name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor pinned ComfyUI
        run: python scripts/vendor_comfyui.py
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: headless-comfy-wheel
          path: dist/*.whl
