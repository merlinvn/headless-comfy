name: portable-downloads
on:
  push:
    branches: ['**']  # Branch pushes only; release tags reuse tested commits.
    paths:
      - 'src/headless_comfy/downloads.py'
      - 'src/headless_comfy/__init__.py'
      - 'src/headless_comfy/_bootstrap.py'
      - 'src/headless_comfy/cli.py'
      - 'src/headless_comfy/runtime.py'
      - 'src/headless_comfy/pipeline.py'
      - 'tests/test_downloads.py'
      - 'pyproject.toml'
      - '.github/workflows/downloads.yml'
  pull_request:
    paths:
      - 'src/headless_comfy/downloads.py'
      - 'src/headless_comfy/__init__.py'
      - 'src/headless_comfy/_bootstrap.py'
      - 'src/headless_comfy/cli.py'
      - 'src/headless_comfy/runtime.py'
      - 'src/headless_comfy/pipeline.py'
      - 'tests/test_downloads.py'
      - 'pyproject.toml'
      - '.github/workflows/downloads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install requests filelock
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - run: python -m unittest discover -s tests -p test_downloads.py -v
