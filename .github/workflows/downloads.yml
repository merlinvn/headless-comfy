name: portable-downloads
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install requests filelock
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - run: python -m unittest discover -s tests -p test_downloads.py -v
